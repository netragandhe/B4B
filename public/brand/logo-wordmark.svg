<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 280 90" width="100%" height="100%">
  <!-- B4B Main Text -->
  <g transform="translate(10, 52)">
    <!-- White outline layer -->
    <text x="0" y="0" font-family="'Inter', 'Montserrat', 'Arial Black', sans-serif" font-size="54" font-weight="900" font-style="italic" fill="#FFFFFF" stroke="#FFFFFF" stroke-width="6" stroke-linejoin="round">B4B</text>
    
    <!-- Blue 'B' -->
    <text x="0" y="0" font-family="'Inter', 'Montserrat', 'Arial Black', sans-serif" font-size="54" font-weight="900" font-style="italic" fill="#0A3D9C">B</text>
    <!-- Yellow '4' -->
    <text x="42" y="0" font-family="'Inter', 'Montserrat', 'Arial Black', sans-serif" font-size="54" font-weight="900" font-style="italic" fill="#FFC800">4</text>
    <!-- Blue 'B' -->
    <text x="88" y="0" font-family="'Inter', 'Montserrat', 'Arial Black', sans-serif" font-size="54" font-weight="900" font-style="italic" fill="#0A3D9C">B</text>
  </g>

  <!-- Yellow Arc Underline -->
  <path d="M 15,60 Q 75,52 135,60" fill="none" stroke="#FFC800" stroke-width="3.5" stroke-linecap="round" />

  <!-- AMERICA Subtext -->
  <g transform="translate(75, 78)" text-anchor="middle">
    <line x1="-60" y1="-4" x2="-45" y2="-4" stroke="#FFC800" stroke-width="2" stroke-linecap="round" />
    <line x1="45" y1="-4" x2="60" y2="-4" stroke="#FFC800" stroke-width="2" stroke-linecap="round" />
    <text x="0" y="0" font-family="'Inter', 'Outfit', 'Arial', sans-serif" font-size="14" font-weight="900" letter-spacing="5" fill="#0A3D9C">AMERICA</text>
  </g>
</svg>
