<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 320" width="100%" height="100%">
  <defs>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0A3D9C" flood-opacity="0.15" />
    </filter>
  </defs>

  <!-- USA Map Background Silhouette -->
  <g fill="#FFC800" stroke="#0A3D9C" stroke-width="2.5" stroke-linejoin="round" opacity="0.95">
    <!-- Simplified SVG USA Map Outline -->
    <path d="M 95,85 Q 110,65 140,75 L 180,72 L 230,78 L 260,75 L 290,95 L 340,92 L 390,110 L 440,110 Q 445,130 435,160 Q 445,190 415,225 L 385,220 Q 370,200 350,205 Q 330,225 305,190 L 250,185 L 200,180 L 160,170 Q 120,165 90,140 Q 80,110 95,85 Z" />
    <!-- Alaska & Hawaii Miniatures -->
    <path d="M 60,205 Q 75,190 95,200 L 90,220 L 70,225 Z" />
    <circle cx="115" cy="225" r="3" />
    <circle cx="125" cy="228" r="2.5" />
    <circle cx="134" cy="232" r="2" />
  </g>

  <!-- B4B Main Text Group with White Outer Outline -->
  <g transform="translate(115, 120)" filter="url(#shadow)">
    <!-- White Backing Outlines for separation -->
    <text x="0" y="70" font-family="'Inter', 'Montserrat', 'Arial Black', sans-serif" font-size="88" font-weight="900" font-style="italic" fill="#FFFFFF" stroke="#FFFFFF" stroke-width="14" stroke-linejoin="round">B4B</text>
    
    <!-- Blue 'B' -->
    <text x="0" y="70" font-family="'Inter', 'Montserrat', 'Arial Black', sans-serif" font-size="88" font-weight="900" font-style="italic" fill="#0A3D9C">B</text>
    <!-- Yellow '4' -->
    <text x="68" y="70" font-family="'Inter', 'Montserrat', 'Arial Black', sans-serif" font-size="88" font-weight="900" font-style="italic" fill="#FFC800" stroke="#0A3D9C" stroke-width="1">4</text>
    <!-- Blue 'B' -->
    <text x="142" y="70" font-family="'Inter', 'Montserrat', 'Arial Black', sans-serif" font-size="88" font-weight="900" font-style="italic" fill="#0A3D9C">B</text>
  </g>

  <!-- Yellow Arc Underline -->
  <path d="M 140,220 Q 250,205 360,220" fill="none" stroke="#FFC800" stroke-width="5" stroke-linecap="round" />

  <!-- AMERICA Subtext & Side Ticks -->
  <g transform="translate(250, 248)" text-anchor="middle">
    <!-- Side Ticks -->
    <line x1="-140" y1="-5" x2="-105" y2="-5" stroke="#FFC800" stroke-width="3" stroke-linecap="round" />
    <line x1="105" y1="-5" x2="140" y2="-5" stroke="#FFC800" stroke-width="3" stroke-linecap="round" />
    
    <!-- AMERICA Text -->
    <text x="0" y="0" font-family="'Inter', 'Outfit', 'Arial', sans-serif" font-size="24" font-weight="900" letter-spacing="9" fill="#0A3D9C">AMERICA</text>
  </g>
</svg>
